<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WAT 추첨</title>
  <style>
    body{font-family:system-ui,sans-serif;padding:16px}
    input,button{padding:10px;margin:6px 6px 6px 0}
    button{cursor:pointer}
    #log{white-space:pre-wrap;border:1px solid #ddd;padding:10px;border-radius:10px}
  </style>
</head>
<body>
  <h1>WAT 레이스 추첨</h1>

  <div>
    <input id="roomId" placeholder="방 코드" />
    <input id="name" placeholder="닉네임" />
    <label><input type="checkbox" id="asHost" /> 호스트</label>
    <input id="hostPassword" placeholder="호스트 비번" />
    <button id="joinBtn">입장</button>
    <button id="drawBtn" disabled>Top7 추첨</button>
  </div>

  <div id="log">대기중…</div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const socket = io("https://wat-race.onrender.com");

    const roomIdEl = document.getElementById("roomId");
    const nameEl = document.getElementById("name");
    const asHostEl = document.getElementById("asHost");
    const hostPwEl = document.getElementById("hostPassword");
    const joinBtn = document.getElementById("joinBtn");
    const drawBtn = document.getElementById("drawBtn");
    const logEl = document.getElementById("log");

    // 초대링크 ?room=WAT 자동 입력
    const params = new URLSearchParams(location.search);
    const room = params.get("room");
    if (room) roomIdEl.value = room;

    let currentRoom = null;
    let isHost = false;

    function log(msg){ logEl.textContent = msg; }

    joinBtn.onclick = () => {
      const roomId = roomIdEl.value.trim();
      const name = nameEl.value.trim();
      const asHost = asHostEl.checked;
      const hostPassword = hostPwEl.value;

      if(!roomId || !name) return alert("방 코드/닉네임 입력");
      currentRoom = roomId;

      socket.emit("joinRoom", { roomId, name, asHost, hostPassword });
      log("입장 요청…");
    };

    drawBtn.onclick = () => {
      if(!currentRoom) return;
      socket.emit("drawTop7", { roomId: currentRoom });
    };

    socket.on("joined", ({ you, isHost: host }) => {
      isHost = host;
      drawBtn.disabled = !isHost;
      log(`입장 완료: ${you}${isHost ? " (호스트)" : ""}`);
    });

    socket.on("participantsUpdate", ({ participants, hostOnline }) => {
      log(`참가자(${participants.length}):\n- ${participants.join("\n- ")}\n\n호스트온라인: ${hostOnline}`);
    });

    socket.on("drawTop7Result", ({ winners }) => {
      const lines = winners
        .slice()
        .sort((a,b)=>a.rank-b.rank)
        .map(w => `${w.rank}등: ${w.name}`)
        .join("\n");
      log("🎉 Top7 결과\n" + lines);
    });

    socket.on("errorMsg", (m) => alert(m));
  </script>
</body>
</html>
